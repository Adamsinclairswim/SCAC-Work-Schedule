<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Manager Schedule Builder</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <h1>Manager Schedule Builder</h1>
    <a href="index.html" class="nav-btn">Employee Page</a>
  </header>

  <main class="container">
    <section class="card">
      <h2>Build Schedule</h2>

      <label for="scheduleStart">Schedule Start Date</label>
      <input type="date" id="scheduleStart" />

      <label for="scheduleEnd">Schedule End Date</label>
      <input type="date" id="scheduleEnd" />

      <button id="generateBtn">Generate Schedule Options</button>
      <button id="saveScheduleBtn">Save Schedule</button>
      <button id="clearScheduleBtn" class="danger">Clear Schedule</button>
    </section>

    <section class="card">
      <h2>Schedule</h2>
      <div id="scheduleArea"></div>
    </section>

    <section class="card">
      <h2>Employee Submissions</h2>
      <div id="employeeList"></div>
    </section>

    <section class="card">
      <h2>Time Off Requests</h2>
      <div id="timeOffList"></div>
      <button id="clearRequestsBtn" class="danger">Clear All Requests</button>
    </section>
  </main>

  <script src="manager.js"></script>
</body>
</html>
