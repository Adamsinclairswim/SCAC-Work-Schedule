<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SCAC Manager Schedule</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>SCAC Manager Schedule</h1>
    <a href="index.html">Employee Page</a>
  </header>

  <main>
    <section class="card">
      <h2>Generate Schedule</h2>

      <label>Start Date</label>
      <input type="date" id="startDate" />

      <label>End Date</label>
      <input type="date" id="endDate" />

      <button id="generateBtn">Generate Schedule</button>
      <button id="saveBtn">Save Schedule</button>
      <button id="clearBtn" class="danger">Clear Saved Schedule</button>
    </section>

    <section class="card">
      <h2>Schedule</h2>
      <div id="scheduleArea"></div>
    </section>

    <section class="card">
      <h2>Employees</h2>
      <div id="employeeList"></div>
    </section>

    <section class="card">
      <h2>Time Off Requests</h2>
      <div id="timeOffList"></div>
    </section>
  </main>

  <script src="manager.js"></script>
</body>
</html>
