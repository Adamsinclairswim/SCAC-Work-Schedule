<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Employee Availability</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <h1>Employee Availability</h1>
    <a href="manager.html" class="nav-btn">Manager Page</a>
  </header>

  <main class="container">
    <section class="card">
      <h2>Submit Your Info</h2>

      <label for="employeeName">Name</label>
      <input type="text" id="employeeName" placeholder="Enter your name" />

      <h3>Roles You Can Work</h3>
      <div class="checkbox-grid">
        <label><input type="checkbox" value="Front Desk" class="role" /> Front Desk</label>
        <label><input type="checkbox" value="Lifeguard" class="role" /> Lifeguard</label>
        <label><input type="checkbox" value="Swim Instructor" class="role" /> Swim Instructor</label>
        <label><input type="checkbox" value="Aura Coverage" class="role" /> Aura Coverage</label>
        <label><input type="checkbox" value="Cleaning" class="role" /> Cleaning</label>
      </div>
    </section>

    <section class="card">
      <h2>Availability</h2>
      <p class="small-text">Check every shift you are available for.</p>

      <div id="availabilityGrid" class="availability-grid"></div>
    </section>

    <section class="card">
      <h2>Time Off Request</h2>

      <label for="timeOffStart">Start Date</label>
      <input type="date" id="timeOffStart" />

      <label for="timeOffEnd">End Date</label>
      <input type="date" id="timeOffEnd" />

      <label for="timeOffReason">Reason</label>
      <textarea id="timeOffReason" placeholder="Optional reason"></textarea>

      <button id="submitBtn">Submit Availability</button>
      <p id="message"></p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
