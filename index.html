<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SCAC Availability</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>SCAC Availability</h1>
    <a href="manager.html">Manager Page</a>
  </header>

  <main>
    <section class="card">
      <h2>Employee Info</h2>

      <label>Name</label>
      <input type="text" id="employeeName" placeholder="Enter your name" />

      <h3>Roles You Can Work</h3>
      <label><input type="checkbox" class="role" value="Front Desk" /> Front Desk</label>
      <label><input type="checkbox" class="role" value="Aura" /> Aura Coverage</label>
      <label><input type="checkbox" class="role" value="Cleaning" /> Cleaning</label>
    </section>

    <section class="card">
      <h2>Availability</h2>
      <p>Check the time blocks you are available for each day.</p>
      <div id="availabilityArea"></div>
    </section>

    <section class="card">
      <h2>Time Off</h2>

      <label>Start Date</label>
      <input type="date" id="timeOffStart" />

      <label>End Date</label>
      <input type="date" id="timeOffEnd" />

      <label>Reason</label>
      <textarea id="timeOffReason" placeholder="Optional"></textarea>

      <button id="submitBtn">Submit</button>
      <p id="message"></p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
